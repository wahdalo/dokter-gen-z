  <meta name="twitter:title" content="Dokter Z - Teman Curhat Mental Health Gen-Z" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

    rel="stylesheet" />
  <title>Dokter Z - Teman Curhat Mental Health Gen-Z</title>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Dokter Z",
      "description": "Curhat dan konsultasi kesehatan mental AI untuk Gen-Z. Gratis, anonim, dan non-judgmental.",
      "url": "https://dokterz.vercel.app",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "IDR"
      }
    }
  </script>

  <style>
    #root:empty {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
    }
    .sk-init {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      padding: 2rem;
    }
    .sk-pulse {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      animation: sk-breathe 1.8s ease-in-out infinite;
    }
    .sk-text {
      width: 200px;
      height: 16px;
      border-radius: 8px;
      background: #334155;
      animation: sk-breathe 1.8s ease-in-out infinite 0.3s;
    }
    .sk-text-short {
      width: 140px;
      height: 12px;
      border-radius: 8px;
      background: #334155;
      animation: sk-breathe 1.8s ease-in-out infinite 0.6s;
    }
    @keyframes sk-breathe {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="sk-init">
      <div class="sk-pulse"></div>
      <div class="sk-text"></div>
      <div class="sk-text-short"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
